databases:
  - name: doppelganger-db
    plan: free
    databaseName: doppelganger
    user: doppelganger_user

services:
  - type: web
    name: digital-doppelganger-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doppelganger-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.0"
